packages:
  - apps/*
  - packages/*
patchedDependencies:
  d3-color@3.1.0: patches/d3-color@3.1.0.patch
  d3-format@3.1.3: patches/d3-format@3.1.3.patch
  vega-functions@6.2.0: patches/vega-functions@6.2.0.patch
# Excalidraw's optional Mermaid importer, which the app does not offer (ADR-0035): with this,
# Mermaid, KaTeX, Cytoscape and what they bring are not installed at all.
overrides:
  "@excalidraw/mermaid-to-excalidraw": link:./patches/no-mermaid
