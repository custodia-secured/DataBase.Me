# SPDX-License-Identifier: AGPL-3.0-or-later
# Nightly fuzzing of the files-folder parser (M5 acceptance: fuzzing of the Markdown/frontmatter
# parser) and of the CSV and PDF importers (M6 acceptance, brief §10: fuzzing for the importers).
# The first layer, proptest, runs in every CI run; this is the second. cargo-fuzz needs a nightly
# toolchain, so the fuzz crate lives outside the workspace (fuzz/Cargo.toml). A crash is uploaded
# as an artifact with the input that caused it; reproduce with
# `cargo +nightly fuzz run <target> <file>`.
#
# Each target starts from the repository's own files of its kind (`seeds` below), named after the
# writable corpus: libFuzzer adds what it finds to the first directory and only reads the rest, so
# fixtures/ is left alone and fuzz/corpus/ stays ignored. A folder's files of another kind cost one
# rejected execution each. From an empty corpus `pdf` reached 389 of 75,448 edges in 60 seconds (run
# 41756169380), which says little about the PDF parser.
name: Fuzz

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: How long to fuzz each target, in seconds
        default: "900"

permissions:
  contents: read

jobs:
  fuzz:
    name: cargo fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: parse
            seeds: fixtures/obsidian fixtures/obsidian-roundtrip fixtures/obsidian-gate
          - target: csv
            seeds: fixtures/csv fixtures/malicious-import
          - target: pdf
            seeds: fixtures/pdf fixtures/malicious-import
    steps:
      - uses: actions/checkout@v5
      - name: Install a nightly toolchain beside the pinned one
        run: |
          rustup toolchain install nightly --profile minimal
          rustup run nightly cargo --version
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
          key: ${{ matrix.target }}
      # The corpus is kept between runs. Otherwise every night restarts from the seeds and no run gets
      # further than its own 900 seconds can. Losing it costs progress and nothing else, since the
      # seeds are in the repository, so the Actions cache is good enough: a night that finds its cache
      # evicted starts from the seeds. A cache entry cannot be overwritten, so each run saves under its
      # own key and restores the newest by prefix. The workflow has no pull_request trigger, so nothing
      # a pull request caches is read here.
      - name: Restore the corpus of earlier runs
        uses: actions/cache/restore@v6
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      # The cargo-fuzz installed above is a prebuilt musl binary, and it builds for the target it was
      # built for unless told otherwise. The sanitizer cannot link against a static libc, and the
      # nightly has no musl std, so name the target the toolchain has.
      - name: Fuzz ${{ matrix.target }}
        env:
          SECONDS_TO_FUZZ: ${{ inputs.seconds || '900' }}
          CORPUS: fuzz/corpus/${{ matrix.target }}
        run: |
          mkdir -p "$CORPUS"
          cargo +nightly fuzz run --target x86_64-unknown-linux-gnu ${{ matrix.target }} \
            "$CORPUS" ${{ matrix.seeds }} -- \
            -max_total_time="$SECONDS_TO_FUZZ" -max_len=65536 -timeout=10 -rss_limit_mb=2048
      - name: Keep the crashing input
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts
          if-no-files-found: ignore
          retention-days: 30
      # Its own step because the combined action saves only when the job passes, and a crash should
      # not lose what the run found before it.
      - name: Keep the corpus for the next run
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v6
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
