# SPDX-License-Identifier: AGPL-3.0-or-later
# CI for every push and pull request (M0 acceptance: ADR-0008).
#   dco       every commit is signed off (ADR-0007)
#   web       ESLint, Prettier, TypeScript, Vitest and the scripts' own tests
#   licences  cargo-deny and the JS licence check (ADR-0009)
#   desktop   on Windows, macOS and Linux: rustfmt, clippy -D warnings, cargo test, release build,
#             then launch the built app and wait for its UI to render and pass its IPC checks
#   coverage  at least 90% of lines in dbme-core, dbme-store, dbme-mirror, dbme-export and
#             dbme-ingest are tested by their own tests (M1 acceptance; M5 Decision 24; M6 Task 3)
#   mobile    dbme-core and dbme-store build for iOS and Android (M1 acceptance)
#   budget    10,000 objects created, edited, deleted and undone in under 2 s, release build (M1);
#             10,000 random interleavings of app and file edits lose nothing (M5)
#   mirror    the files-folder budgets, release: an edit reaches its file and a file reaches the
#   budget    app, each under 2 s with 10,000 pages; gated on Ubuntu, printed on macOS (M5)
#   watcher   what `notify` reports on each OS, printed as the record; never blocks (M5)
#   ingest    the import budgets, release, printed and not gated: 10,000 CSV rows, a 100-page
#   budget    PDF, a 12-megapixel thumbnail (M6 Decision 10)
#   e2e       every view in Edge (for WebView2) and WebKit, at desktop and phone sizes, with axe
#             and the M2 budgets: a 100k-row table at 60 fps, typing under 16 ms (ADR-0018); the
#             files folder both ways through "Sync now" (M5 Decision 25)
# Nightly fuzzing of the parser and the CSV and PDF importers is .github/workflows/fuzz.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check every commit is signed off
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            node scripts/dco-check.mjs "$PR_BASE..$PR_HEAD"
          elif [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
            node scripts/dco-check.mjs "$PUSH_BEFORE..$GITHUB_SHA"
          else
            # First push of a branch, or a manual run: check the whole history.
            node scripts/dco-check.mjs --all "$GITHUB_SHA"
          fi

  web:
    name: Web UI (lint, format, types, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test

  cargo-deny:
    name: Rust licences and advisories (${{ matrix.checks }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        checks: [advisories, bans licenses sources]
    # A new advisory against a transitive dependency should not block unrelated work; it is
    # reported, and fixed in its own pull request.
    continue-on-error: ${{ matrix.checks == 'advisories' }}
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check ${{ matrix.checks }}

  js-licences:
    name: JS licences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm licenses:js

  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-22.04 is the oldest Linux we support (WebKitGTK 4.1), so build and launch there.
        os: [ubuntu-22.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux system libraries (WebKitGTK 4.1) and a virtual display
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            xvfb

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # rust-toolchain.toml pins the compiler and its components; this installs exactly that.
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2

      - name: Build the web UI (the Rust build embeds it)
        run: pnpm --filter @databaseme/desktop build
      - name: Check the e2e test transport is not in it
        if: runner.os == 'Linux'
        run: node scripts/check-e2e-transport.mjs absent apps/desktop/dist

      - name: rustfmt
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: cargo test
        run: cargo test --workspace --locked

      - name: Build the desktop app (release, no installer)
        run: pnpm --filter @databaseme/desktop tauri build --no-bundle

      - name: Launch the app and wait for its UI (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/smoke-launch.mjs target/release/dbme-desktop

      # The zero-network gate (M7, ADR-0028): the same launch under strace, then every socket the
      # app and the webview touched, with any address outside the machine a failure. Windows and
      # macOS are checked by hand per release (docs/user-guide/privacy.md).
      - name: Install strace
        if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends strace
      - name: Zero network requests on first launch with default settings
        if: runner.os == 'Linux'
        env:
          DBME_SMOKE_WRAP: strace -f -o target/network-trace.txt -e trace=network
        run: |
          xvfb-run -a node scripts/smoke-launch.mjs target/release/dbme-desktop
          node scripts/network-probe.mjs target/network-trace.txt
      - name: Keep the network trace
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: network-trace
          path: target/network-trace.txt
          if-no-files-found: ignore
          retention-days: 30
      - name: Launch the app and wait for its UI
        if: runner.os != 'Linux'
        run: node scripts/smoke-launch.mjs target/release/dbme-desktop

  coverage:
    name: Coverage (core, store, mirror, export, ingest; 90% of lines)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install the pinned Rust toolchain and llvm-tools
        run: |
          rustup toolchain install
          rustup component add llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      # Each crate is measured by its own tests only: store's tests also run core code, which must
      # not count towards core.
      - name: dbme-core
        run: cargo llvm-cov --locked -p dbme-core --summary-only --fail-under-lines 90
      - name: dbme-store
        run: >-
          cargo llvm-cov --locked -p dbme-store --summary-only --fail-under-lines 90
          --ignore-filename-regex 'crates/core/'
      # The platform watcher is a probe on each OS, not part of the engine's gate (M5 Decision 24).
      - name: dbme-mirror
        run: >-
          cargo llvm-cov --locked -p dbme-mirror --summary-only --fail-under-lines 90
          --ignore-filename-regex 'crates/(core|store)/|crates/mirror/src/watcher\.rs'
      - name: dbme-export
        run: >-
          cargo llvm-cov --locked -p dbme-export --summary-only --fail-under-lines 90
          --ignore-filename-regex 'crates/(core|store|mirror)/'
      - name: dbme-ingest
        run: >-
          cargo llvm-cov --locked -p dbme-ingest --summary-only --fail-under-lines 90
          --ignore-filename-regex 'crates/(core|store|mirror|export)/'

  mobile:
    name: Mobile build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-ios
            os: macos-latest
          - target: aarch64-linux-android
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install the pinned Rust toolchain and the target
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      # The runner's NDK; API level 29 (Android 10) is the oldest the plan supports.
      - name: Use the Android NDK's compiler for SQLite and the linker
        if: matrix.target == 'aarch64-linux-android'
        run: |
          bin="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          {
            echo "CC_aarch64_linux_android=$bin/aarch64-linux-android29-clang"
            echo "AR_aarch64_linux_android=$bin/llvm-ar"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$bin/aarch64-linux-android29-clang"
          } >> "$GITHUB_ENV"
      - run: cargo build --locked --release -p dbme-core -p dbme-store --target ${{ matrix.target }}

  budget:
    name: Performance budget (release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # The gate measures bulk changes (ADR-0015). The per-transaction figure is printed for the
      # record, in its own step afterwards: run together, the two tests slow each other down. The
      # same goes for the tests inside the binary (the M4 search gate seeds 100,000 objects), so
      # they run one at a time.
      - name: 10,000 objects in bulk (gated)
        run: cargo test --locked --release -p dbme-store --test budget -- --test-threads=1 --nocapture
      - name: One transaction per change (measured, not gated)
        run: cargo test --locked --release -p dbme-store --test budget -- --ignored --nocapture
      # The M5 acceptance property at its full count (M5 Decision 22): every `cargo test` runs
      # 200 cases; this runs 10,000 and prints the time a case takes (gate 1f).
      - name: 10,000 interleavings of app and file edits lose nothing
        env:
          DBME_INTERLEAVINGS: "10000"
        run: cargo test --locked --release -p dbme-mirror --test interleavings -- --nocapture

  mirror-budget:
    name: Files-folder budget (${{ matrix.os }}, release)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    # Gated on Ubuntu; macOS prints its figures for the record (M5 Task 9), since FSEvents
    # latency on a shared runner is not ours to budget.
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: An edit reaches its file, a file reaches the app, each under 2 s with 10,000 pages
        run: cargo test --locked --release -p dbme-mirror --test budget -- --nocapture

  ingest-budget:
    name: Import budgets (release, informational)
    runs-on: ubuntu-latest
    # The brief names no import budget (M6 Decision 10): the three figures are printed for the
    # record and gate nothing; the test asserts what was made, not the time.
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: 10,000 CSV rows, a 100-page PDF, a 12-megapixel thumbnail
        run: cargo test --locked --release -p dbme-ingest --test budget -- --nocapture

  watcher-probes:
    name: Watcher probes (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    # The probes assert what Windows reports (gate 1e) and, on the other two systems, print
    # whether each shape matched; the printed event lists are the record ADR-0024 cites. The
    # engine's own watcher test asserts on all three. The job is advisory: the engine does not
    # depend on the watcher (`rescan` derives the same events), and a runner's file-system timing
    # is not ours.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Run the probes and keep what they printed
        shell: bash
        run: |
          mkdir -p target/watcher-probes
          cargo test --locked -p dbme-mirror --test gate_watcher --test watcher -- \
            --test-threads=1 --nocapture 2>&1 \
            | tee "target/watcher-probes/${{ matrix.os }}.txt"
      - name: Keep the record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: watcher-probes-${{ matrix.os }}
          path: target/watcher-probes
          retention-days: 90

  e2e:
    name: End-to-end (Edge and WebKit)
    # Windows, as on the reference machine: Edge there is the engine WebView2 ships.
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # Built before the run, so Playwright's wait for the server is not spent compiling it.
      - name: Build the test server
        run: cargo build --locked -p dbme-e2e-server
      # Edge comes with the runner; WebKit is Playwright's own build.
      - name: Install WebKit for Playwright
        run: pnpm --filter @databaseme/desktop exec playwright install webkit
      # The Rust cache keeps this folder's subfolders but deletes its files, marker included, and the
      # test server refuses a folder it can't recognise as its own.
      - name: Remove test data restored from the cache
        shell: bash
        run: rm -rf target/e2e-data
      - name: Run the end-to-end tests
        run: pnpm --filter @databaseme/desktop e2e
      # The marker that proves the transport absent from the app must still find it here.
      - name: Check the e2e build carries the test transport
        run: node scripts/check-e2e-transport.mjs present apps/desktop/dist-e2e
      - name: Keep the report and traces of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            target/e2e-report
            target/e2e-results
          retention-days: 14
      - name: Keep the budget results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-budgets
          path: target/budgets
          if-no-files-found: ignore
