[package]
name = "dbme-store"
description = "DataBase.Me storage: the SQLite vault, migrations, the op log and the blob store. All SQL lives here."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
dbme-core.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
specta = { workspace = true, optional = true }
tempfile.workspace = true
thiserror.workspace = true

[dev-dependencies]
criterion.workspace = true
proptest.workspace = true

[[bench]]
name = "ops"
harness = false

[features]
# Derives specta::Type on the types the desktop app sends over IPC (ADR-0014).
specta = ["dep:specta", "dbme-core/specta"]

[lints]
workspace = true
