[workspace]
resolver = "3"
members = [
  "apps/desktop/src-tauri",
  "crates/api",
  "crates/cli",
  "crates/core",
  "crates/e2e-server",
  "crates/export",
  "crates/mirror",
  "crates/store",
]
# The cargo-fuzz crate needs a nightly toolchain and is its own workspace (fuzz/Cargo.toml).
exclude = ["fuzz"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-or-later"
publish = false

[workspace.dependencies]
dbme-api = { path = "crates/api" }
dbme-core = { path = "crates/core" }
dbme-export = { path = "crates/export" }
dbme-mirror = { path = "crates/mirror" }
dbme-store = { path = "crates/store" }

base64 = "0.23"
blake3 = "1.8"
clap = { version = "4.6", features = ["derive"] }
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
# The files folder's format (ADR-0006): pure Rust with no C or platform code, since dbme-core
# cross-compiles for iOS and Android. diffy merges inside one block; pulldown-cmark parses the
# body without its getopts and HTML defaults; saphyr reads and writes the frontmatter.
diffy = "0.5"
getrandom = "0.4"
# The watcher behind the files folder (ADR-0006). Desktop only, in crates/mirror, never in
# dbme-core. notify is CC0-1.0: see the exception in deny.toml and the row in ADR-0009.
notify = "8.2"
notify-debouncer-full = "0.7"
proptest = "1.12"
pulldown-cmark = { version = "0.13", default-features = false }
rusqlite = { version = "0.41", features = ["bundled"] }
saphyr = "0.3"
serde = { version = "1", features = ["derive"] }
# float_roundtrip: numbers read back exactly as written, which op preconditions rely on (ADR-0012).
serde_json = { version = "1", features = ["float_roundtrip"] }
# Typed IPC (ADR-0014). Release candidates, so pinned exactly; upgrade them together.
specta = { version = "=2.0.0-rc.26", features = ["derive", "serde_json"] }
specta-typescript = "=0.0.13"
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }
tempfile = "3.27"
thiserror = "2"
# The e2e test server only (ADR-0018); never in the app.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
ulid = { version = "3", default-features = false }
# NFC for file names and path keys in the files folder (FORMAT.md §6.1): pure Rust, MIT OR Apache-2.0.
unicode-normalization = "0.1"

# Coding standards (handoff §9): no unwrap()/expect() outside tests, documented public APIs, and
# no unsafe code. CI runs clippy with -D warnings, so every warning here fails the build.
[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
