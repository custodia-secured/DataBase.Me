# SPDX-License-Identifier: AGPL-3.0-or-later
# Coverage-guided fuzzing with cargo-fuzz: the files-folder parser (M5 Task 9, the second layer
# behind crates/core/tests/files_fuzz.rs) and the CSV and PDF importers (M6 Task 9, behind
# crates/ingest/tests/fuzz_csv.rs and fuzz_pdf.rs). Needs a nightly toolchain, so it is outside
# the workspace: `cargo +nightly fuzz run <parse|csv|pdf>` from the repository root;
# .github/workflows/fuzz.yml runs each target on a schedule.
[package]
name = "dbme-fuzz"
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
dbme-core = { path = "../crates/core" }
dbme-ingest = { path = "../crates/ingest" }
serde_json = "1"

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "csv"
path = "fuzz_targets/csv.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pdf"
path = "fuzz_targets/pdf.rs"
test = false
doc = false
bench = false

# Its own workspace, so the root's `--locked` builds and cargo-deny never see it.
[workspace]
